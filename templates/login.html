<!DOCTYPE html><html><head><title>Login - Plex Barcode Remote</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><h1>Plex Barcode Remote Login <button id="theme-toggle">☀️</button></h1><div class='form-container'>{% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}<div class='flash-container'>{% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}</div>{% endif %}{% endwith %}<form method='post'><div class='form-group'><label for='username'>Username</label><input type='text' id='username' name='username' required></div><div class='form-group'><label for='password'>Password</label><input type='password' id='password' name='password' required></div><button type='submit'>Login</button></form></div><script>document.getElementById('theme-toggle').addEventListener('click',()=>{let e=document.body.classList.toggle('dark-mode');localStorage.setItem('theme',e?'dark':'light');updateThemeIcon(e)});function updateThemeIcon(e){document.getElementById('theme-toggle').textContent=e?'🌙':'☀️'}if(localStorage.getItem('theme')==='dark'||!localStorage.getItem('theme')&&window.matchMedia('(prefers-color-scheme: dark)').matches){document.body.classList.add('dark-mode');updateThemeIcon(true)}</script></body></html>
