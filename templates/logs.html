<!DOCTYPE html><html><head><title>Plex Barcode Dashboard - Logs</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><h1>Plex Barcode Dashboard Logs <button id="theme-toggle">☀️</button></h1><div class='log-container'><p><a href='/' class='button-link'>Back to Dashboard</a></p><div class='log-controls'><span>Show logs from last:</span><a href='/logs?days=1' class='button-link {% if current_days == "1" %}active{% endif %}'>1 Day</a><a href='/logs?days=3' class='button-link {% if current_days == "3" %}active{% endif %}'>3 Days</a><a href='/logs?days=7' class='button-link {% if current_days == "7" %}active{% endif %}'>7 Days</a><a href='/logs?days=all' class='button-link {% if current_days == "all" %}active{% endif %}'>All Time</a></div><table><thead><tr><th>Timestamp</th><th>Source</th><th>Message</th></tr></thead><tbody>{% for log in logs %}<tr><td>{{ log.timestamp }}</td><td>{{ log.source }}</td><td>{{ log.message }}</td></tr>{% else %}<tr><td colspan=3>No log entries found for this period.</td></tr>{% endfor %}</tbody></table></div><script>document.getElementById('theme-toggle').addEventListener('click',()=>{let e=document.body.classList.toggle('dark-mode');localStorage.setItem('theme',e?'dark':'light');updateThemeIcon(e)});function updateThemeIcon(e){document.getElementById('theme-toggle').textContent=e?'🌙':'☀️'}if(localStorage.getItem('theme')==='dark'||!localStorage.getItem('theme')&&window.matchMedia('(prefers-color-scheme: dark)').matches){document.body.classList.add('dark-mode');updateThemeIcon(true)}</script></body></html>
