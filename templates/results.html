<!DOCTYPE html><html><head><title>Search Results</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body><h1>Results for {{ query_type }}: "{{ query }}" <button id="theme-toggle">☀️</button></h1><p><a href='/' class='button-link'>Back to Dashboard</a></p><table><thead><tr><th>Title</th><th>Year</th><th>Type</th></tr></thead><tbody>{% for item in results %}<tr><td>{{ item.title }}</td><td>{{ item.year }}</td><td>{{ item.type }}</td></tr>{% else %}<tr><td colspan='3'>No results found in your library.</td></tr>{% endfor %}</tbody></table><script>document.getElementById('theme-toggle').addEventListener('click',()=>{let e=document.body.classList.toggle('dark-mode');localStorage.setItem('theme',e?'dark':'light');updateThemeIcon(e)});function updateThemeIcon(e){document.getElementById('theme-toggle').textContent=e?'🌙':'☀️'}if(localStorage.getItem('theme')==='dark'||!localStorage.getItem('theme')&&window.matchMedia('(prefers-color-scheme: dark)').matches){document.body.classList.add('dark-mode');updateThemeIcon(true)}</script></body></html>
